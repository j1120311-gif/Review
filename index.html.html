<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>會考五科複習站</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg:#f8f7f4; --surface:#fff; --surface2:#f1efe8;
  --text:#1a1a1a; --text2:#6b6b6b;
  --border:rgba(0,0,0,0.1); --border2:rgba(0,0,0,0.18);
  --blue:#378ADD; --blue-l:#E6F1FB; --blue-d:#0C447C;
  --green:#639922; --green-l:#EAF3DE; --green-d:#27500A;
  --red:#E24B4A; --red-l:#FCEBEB; --red-d:#A32D2D;
  --amber:#BA7517; --amber-l:#FAEEDA; --amber-d:#633806;
  --purple:#534AB7; --purple-l:#EEEDFE; --purple-d:#26215C;
  --teal:#0F6E56; --teal-l:#E1F5EE; --teal-d:#04342C;
}
body { font-family: -apple-system,'Noto Sans TC',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
header { background:var(--surface); border-bottom:0.5px solid var(--border); padding:14px 20px; display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:200; }
.logo { width:34px; height:34px; background:var(--blue); border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.logo svg { width:18px; height:18px; stroke:white; fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
header h1 { font-size:15px; font-weight:700; }
.badge { margin-left:auto; background:var(--red-l); color:var(--red-d); font-size:11px; font-weight:600; padding:4px 10px; border-radius:20px; white-space:nowrap; }
.main { max-width:900px; margin:0 auto; padding:18px 14px 80px; }
.subject-bar { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
.sb { padding:9px 14px; border-radius:22px; border:1px solid var(--border2); background:var(--surface); color:var(--text2); font-size:13px; font-family:inherit; font-weight:500; cursor:pointer; touch-action:manipulation; min-height:44px; display:flex; align-items:center; gap:5px; transition:all 0.15s; }
.sb.on { color:white; border-color:transparent; }
.sb[data-s="sci"].on  { background:var(--blue); }
.sb[data-s="math"].on { background:var(--green); }
.sb[data-s="eng"].on  { background:var(--purple); }
.sb[data-s="hist"].on { background:var(--amber); }
.sb[data-s="geo"].on  { background:var(--teal); }
.sb[data-s="civ"].on  { background:var(--red); }
.tab-bar { display:flex; gap:4px; margin-bottom:18px; background:var(--surface); border-radius:12px; padding:4px; border:1px solid var(--border); }
.tb { flex:1; padding:10px 6px; border:none; border-radius:9px; background:transparent; color:var(--text2); font-size:14px; font-family:inherit; font-weight:500; cursor:pointer; touch-action:manipulation; min-height:44px; }
.tb.on { background:var(--blue); color:white; }
.pane { display:none; } .pane.on { display:block; }
.hint { font-size:13px; color:var(--text2); margin-bottom:14px; }
.chip-row { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:16px; }
.chip { padding:7px 14px; border-radius:20px; border:1px solid var(--border2); background:var(--surface); color:var(--text2); font-size:13px; font-family:inherit; font-weight:500; cursor:pointer; touch-action:manipulation; min-height:40px; display:flex; align-items:center; }
.chip.on { background:var(--blue-l); color:var(--blue-d); border-color:var(--blue); }
.notes-box { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px; margin-bottom:12px; }
.note-h { font-size:15px; font-weight:700; margin-bottom:12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.tag { font-size:11px; font-weight:600; padding:3px 9px; border-radius:10px; }
.tag-r { background:var(--red-l); color:var(--red-d); }
.tag-b { background:var(--blue-l); color:var(--blue-d); }
.note-item { display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:0.5px solid var(--border); }
.note-item:last-child { border-bottom:none; padding-bottom:0; }
.dot { width:6px; height:6px; min-width:6px; border-radius:50%; background:var(--blue); margin-top:10px; }
.note-t { font-size:13px; line-height:1.8; color:var(--text); }
.note-s { font-size:12px; color:var(--text2); margin-top:4px; line-height:1.6; }
.fml { background:var(--surface2); border-left:3px solid var(--blue); padding:10px 12px; margin:8px 0; font-size:13px; line-height:1.7; border-radius:0 6px 6px 0; }
.prog-wrap { margin-bottom:16px; }
.prog-meta { display:flex; justify-content:space-between; font-size:13px; color:var(--text2); margin-bottom:7px; }
.prog-bg { height:5px; background:var(--surface2); border-radius:3px; overflow:hidden; }
.prog-fill { height:5px; background:var(--blue); border-radius:3px; transition:width 0.3s; }
.q-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px; margin-bottom:12px; }
.q-meta { display:flex; gap:7px; margin-bottom:12px; flex-wrap:wrap; align-items:center; }
.q-text { font-size:14px; font-weight:500; line-height:1.75; margin-bottom:16px; }
.opts { display:flex; flex-direction:column; gap:8px; margin-bottom:12px; }
.opt { padding:13px 16px; border-radius:10px; border:1px solid var(--border2); background:transparent; text-align:left; cursor:pointer; font-size:14px; font-family:inherit; color:var(--text); touch-action:manipulation; min-height:48px; width:100%; }
.opt.correct { background:var(--green-l); border-color:var(--green); color:var(--green-d); font-weight:500; }
.opt.wrong { background:var(--red-l); border-color:var(--red); color:var(--red-d); }
.opt:disabled { cursor:default; }
.explain { background:var(--surface2); border-radius:10px; padding:13px; font-size:13px; color:var(--text2); line-height:1.7; display:none; }
.explain.show { display:block; }
.btn-row { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
.btn { padding:12px 22px; border-radius:10px; border:1px solid var(--border2); background:var(--surface); cursor:pointer; font-size:14px; font-family:inherit; color:var(--text); font-weight:500; touch-action:manipulation; min-height:46px; }
.btn.primary { background:var(--blue); color:white; border-color:var(--blue); }
.score-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:18px; }
.score-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px; }
.score-label { font-size:12px; color:var(--text2); margin-bottom:5px; }
.score-val { font-size:26px; font-weight:700; }
.weak-box { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px; margin-bottom:14px; }
.weak-title { font-size:14px; font-weight:700; margin-bottom:12px; }
.weak-item { display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:0.5px solid var(--border); font-size:13px; }
.weak-item:last-child { border-bottom:none; }
.mini-bar-bg { width:60px; height:5px; background:var(--surface2); border-radius:3px; overflow:hidden; display:inline-block; vertical-align:middle; margin:0 6px; }
.mini-bar { height:5px; border-radius:3px; }
footer { text-align:center; font-size:12px; color:var(--text2); padding:20px; }
</style>
</head>
<body>
<header>
  <div class="logo"><svg viewBox="0 0 24 24"><polyline points="2,7 12,2 22,7"/><polyline points="2,12 12,7 22,12"/><polyline points="2,17 12,12 22,17"/></svg></div>
  <div><h1>會考五科複習站</h1></div>
  <div class="badge">加油！你可以的 💪</div>
</header>

<div class="main">
  <div class="subject-bar" id="subject-bar">
    <button class="sb on" data-s="sci">🔬 自然</button>
    <button class="sb" data-s="math">📐 數學</button>
    <button class="sb" data-s="eng">🔤 英文</button>
    <button class="sb" data-s="hist">📜 歷史</button>
    <button class="sb" data-s="geo">🌏 地理</button>
    <button class="sb" data-s="civ">⚖️ 公民</button>
  </div>
  <div class="tab-bar" id="tab-bar">
    <button class="tb on" data-t="notes">重點筆記</button>
    <button class="tb" data-t="quiz">模擬練習</button>
    <button class="tb" data-t="stats">弱點分析</button>
  </div>
  <div id="pane-notes" class="pane on">
    <div id="sub-chips" class="chip-row"></div>
    <div id="notes-content"></div>
  </div>
  <div id="pane-quiz" class="pane">
    <div class="prog-wrap">
      <div class="prog-meta"><span id="q-label">題目 1/15</span><span id="q-score">答對：0</span></div>
      <div class="prog-bg"><div class="prog-fill" id="q-bar" style="width:10%"></div></div>
    </div>
    <div id="q-container"></div>
    <div class="btn-row"><button class="btn primary" id="btn-next" style="display:none">下一題 →</button></div>
  </div>
  <div id="pane-stats" class="pane">
    <div class="score-grid">
      <div class="score-card"><div class="score-label">已答題數</div><div class="score-val" id="st-total">0</div></div>
      <div class="score-card"><div class="score-label">答對題數</div><div class="score-val" id="st-correct">0</div></div>
      <div class="score-card"><div class="score-label">正確率</div><div class="score-val" id="st-pct">—</div></div>
    </div>
    <div class="weak-box"><div class="weak-title">各科表現</div><div id="weak-list"><p class="hint">先完成練習題，這裡會顯示弱點分析</p></div></div>
    <div class="btn-row"><button class="btn" id="btn-reset">重置紀錄</button></div>
  </div>
</div>
<footer>會考五科複習站 · 加油！你一定可以的 💪</footer>

<script>
var notes = {
  sci: {
    subs: ['生物','化學','物理','地科'],
    生物:[
      {h:'細胞的構造與功能',freq:'高頻',items:[
        {t:'動物細胞：含細胞膜、細胞核、粒線體、核糖體、高基氏體、內質網、中心粒等',s:'中心粒協助有絲分裂時紡錘絲形成'},
        {t:'植物細胞：含細胞膜、細胞核、粒線體、葉綠體、大液泡、細胞壁、核糖體等',s:'細胞壁由纖維素組成，具支持及保護功能'},
        {t:'細胞膜：具選擇透過性，控制物質進出；雙層磷脂分子加蛋白質',s:'物質進出方式：擴散、滲透、主動運輸、吞噬'},
        {t:'粒線體（cellular respiration）：有雙層膜，含自己的DNA，進行有氧呼吸第2、3階段',s:'線粒體數量多→細胞代謝活躍'},
        {t:'葉綠體（photosynthesis）：含葉綠素a、b，進行光合作用，亦含DNA',s:'綠色來自葉綠素，黃色來自類胡蘿蔔素'},
      ]},
      {h:'光合作用與呼吸作用',freq:'高頻',items:[
        {t:'光合作用位置與反應式',s:'進行地點：葉綠體；6CO₂+6H₂O+光能→C₆H₁₂O₆+6O₂'},
        {t:'光反應（明反應）：需光，進行於類囊體膜，將光能轉為ATP和NADPH',s:'反應：2H₂O+光能→O₂+4H⁺+4e⁻（發生在光系統Ⅱ）'},
        {t:'暗反應（卡爾文循環）：不需光，進行於基質，用ATP和NADPH製造葡萄糖',s:'第一步：CO₂固定→3-磷酸甘油酸；第三步：再生RuBP'},
        {t:'有氧呼吸（cellular respiration）：C₆H₁₂O₆+6O₂→6CO₂+6H₂O+能量(ATP)',s:'第一階段：糖酵解（細胞質基質，產2ATP+2NADH）'},
        {t:'有氧呼吸第二、三階段：進行於粒線體基質和內膜',s:'第二階段：丙酮酸進入粒線體，經檸檬酸循環(Krebs)產ATP+NADH+FADH₂'},
        {t:'無氧呼吸：葡萄糖→乳酸（動物肌肉無氧運動）或乙醇（酵母菌發酵）',s:'無氧呼吸只產少量ATP（2個），主要用於能量急速需求'},
      ]},
      {h:'遺傳與基因',freq:'高頻',items:[
        {t:'DNA結構：雙股螺旋結構，由核苷酸組成（含磷酸、五碳糖、含氮鹼基）',s:'4種鹼基：A、T、G、C；互補配對：A-T、G-C'},
        {t:'RNA結構與類型：單股，由核糖核苷酸組成',s:'mRNA（信使）：攜帶遺傳資訊；rRNA（核糖）：核糖體成分；tRNA（轉運）：携帶胺基酸'},
        {t:'中心法則：DNA→RNA→蛋白質',s:'轉錄（Transcription）在細胞核進行（DNA→mRNA）；轉譯（Translation）在核糖體進行（mRNA→蛋白質）'},
        {t:'基因表現與表現型',s:'基因型（AA、Aa、aa）決定表現型（顯性、隱性性狀）'},
        {t:'孟德爾第一定律（分離律）：F1代全為顯性，F2代 3:1',s:'當F1（Aa）自交，F2（AA:Aa:aa=1:2:1）→ 表現型3:1'},
        {t:'孟德爾第二定律（自由組合律）：不同特徵基因獨立分配',s:'雙因子雜交 F2 表現型比例 9:3:3:1'},
        {t:'減數分裂：產生配子（精卵），染色體數目減半',s:'人體：體細胞46條（23對）→配子23條；性別由Y決定'},
      ]},
      {h:'生物多樣性與進化',freq:'中頻',items:[
        {t:'分類：界→門→綱→目→科→屬→種',s:'物種定義：生殖上可相互交配產生可育後代的生物群體'},
        {t:'演化證據：化石紀錄、比較解剖學、比較胚胎學、生物化學證據',s:'遺跡器官：祖先留下但已退化（人類尾骨、闌尾）'},
        {t:'天擇說（達爾文）：適應→競爭→選擇→遺傳→進化',s:'天擇是微進化機制，突變提供變異來源'},
        {t:'物種形成：地理隔離→遺傳漂變→演化→新物種產生',s:'同源器官表明共同祖先；趨同進化顯示環境適應'},
      ]},
      {h:'人體生理系統',freq:'中頻',items:[
        {t:'消化系統：食道→胃→小腸→大腸',s:'營養吸收主要在小腸（絨毛增加表面積）'},
        {t:'消化酶：唾液澱粉酶（口腔，澱粉→麥芽糖）；胰澱粉酶（小腸，澱粉→葡萄糖）',s:'胃蛋白酶（蛋白質→胜肽）；小腸胜肽酶（胜肽→胺基酸）'},
        {t:'循環系統：心臟→動脈→毛細血管→靜脈→心臟',s:'體循環：左心室→全身→右心房；肺循環：右心室→肺→左心房'},
        {t:'血液成分：紅血球（運氧）、白血球（免疫）、血小板（凝血）、血漿',s:'紅血球含血紅素，能與O₂結合；正常人4500-5500個/μL'},
        {t:'呼吸系統：鼻→氣管→支氣管→肺泡',s:'肺泡是氣體交換場所（薄壁、多數量、血流豐富）'},
        {t:'神經系統：中樞神經（腦+脊髓）+周圍神經',s:'反射弧：受器→傳入神經→神經中樞→傳出神經→動器（最快）'},
        {t:'內分泌系統：激素經血液運輸，作用遠且持久',s:'胰島素↓血糖；升糖激素↑血糖；甲狀腺激素↑代謝'},
      ]},
    ],
    化學:[
      {h:'物質的組成與分類',freq:'高頻',items:[
        {t:'物理變化 vs 化學變化：化學變化產生新物質，伴隨能量變化',s:'判斷：有無新物質生成（顏色、沉澱、氣體、溫度明顯改變）'},
        {t:'物質分類：單質（金屬、非金屬、稀有氣體）、化合物',s:'元素：原子組成的純物質；化合物：兩種以上元素化合'},
        {t:'原子結構：質子(+)、中子(0)、電子(-)；原子序=質子數',s:'質量數=質子數+中子數；同位素質子數同、中子數異'},
        {t:'電子排列：1s²2s²2p⁶3s²3p⁶...（能級越低越先填）',s:'價電子數決定化學性質；同族元素價電子數相同'},
      ]},
      {h:'化學鍵與化合物',freq:'高頻',items:[
        {t:'化學鍵：離子鍵（金屬+非金屬，e⁻轉移）；共價鍵（非金屬+非金屬，e⁻共享）',s:'金屬鍵：金屬原子間的粘聚力'},
        {t:'化合物類型：離子化合物（NaCl）、共價化合物（CO₂、H₂O）、金屬化合物',s:'離子化合物一般是固體、易溶水、熔點高'},
        {t:'分子與離子：分子（H₂、O₂、CO₂）；離子（Na⁺、Cl⁻、OH⁻）',s:'莫耳數計算：莫耳數=質量(g)÷相對分子質量'},
      ]},
      {h:'酸、鹼、鹽與pH',freq:'高頻',items:[
        {t:'pH值定義：pH=-log[H⁺]；<7酸、=7中性、>7鹼',s:'pH每差1，[H⁺]差10倍；pH=3的溶液[H⁺]濃度是pH=5的100倍'},
        {t:'常見指示劑：石蕊（酸紅鹼藍）、酚酞（酸無色鹼粉紅）、BTB（酸黃中綠鹼藍）',s:'甲基橙：酸紅鹼黃（滴定用）'},
        {t:'中和反應：酸+鹼→鹽+水，例：HCl+NaOH→NaCl+H₂O',s:'反應速率快，放熱，用於製造鹽'},
        {t:'鹽的水解：強酸弱鹼鹽（酸性）、弱酸強鹼鹽（鹼性）、強酸強鹼鹽（中性）',s:'例：CH₃COONa+H₂O⇌CH₃COOH+NaOH（溶液鹼性）'},
        {t:'常見強酸：HCl、HNO₃、H₂SO₄；常見強鹼：NaOH、KOH、Ca(OH)₂（石灰水）',s:'常見弱酸：CH₃COOH、H₂CO₃；弱鹼：NH₃·H₂O'},
      ]},
      {h:'化學反應與能量',freq:'中頻',items:[
        {t:'質量守恆定律：反應前後原子總數、總質量不變',s:'化學方程式配平：使等號兩邊原子數相同'},
        {t:'氧化還原反應：氧化=失e⁻（氧化態升高）；還原=得e⁻（氧化態降低）',s:'口訣：氧失還得；電子轉移數=失e⁻數=得e⁻數'},
        {t:'燃燒反應：物質+O₂→氧化物，放熱',s:'完全燃燒：C→CO₂、H₂→H₂O、S→SO₂'},
        {t:'非金屬單質與金屬單質的反應：2Na+Cl₂→2NaCl（快速、放熱）',s:'活潑順序：Na>Mg>Al>C>Fe>Cu（越靠前越活潑）'},
        {t:'電解質與非電解質：電解質溶於水能導電（強電解質完全解離）',s:'強電解質：強酸、強鹼、鹽；弱電解質：弱酸、弱鹼、水'},
      ]},
    ],
    物理:[

function renderSubChips() {
  var row = document.getElementById('sub-chips');
  var s = notes[curSubject];
  if (!s.subs) { row.style.display='none'; return; }
  row.style.display='flex';
  var html = '';
  for (var i=0; i<s.subs.length; i++) {
    var active = s.subs[i] === curSciSub ? ' on' : '';
    html += '<button class="chip'+active+'" data-sub="'+s.subs[i]+'">'+s.subs[i]+'</button>';
  }
  row.innerHTML = html;
  row.addEventListener('click', function(e) {
    if (!e.target.classList.contains('chip')) return;
    curSciSub = e.target.getAttribute('data-sub');
    document.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('on'); });
    e.target.classList.add('on');
    renderNoteContent();
  });
}

  var s = notes[curSubject];
  var data = s.subs ? s[curSciSub] : s.data;
  if (!data) { document.getElementById('notes-content').innerHTML='<p class="hint">暫無資料</p>'; return; }
  var html = '';
  for (var i=0; i<data.length; i++) {
    var sec = data[i];
    var tagCls = sec.freq==='高頻'?'tag-r':'tag-b';
    html += '<div class="notes-box"><div class="note-h">'+sec.h+'<span class="tag '+tagCls+'">'+sec.freq+'</span></div>';
    for (var j=0; j<sec.items.length; j++) {
      var item = sec.items[j];
      html += '<div class="note-item"><div class="dot"></div><div class="note-t">'+item.t;
      if (item.s) html += '<div class="note-s">'+item.s+'</div>';
      html += '</div></div>';
    }
    html += '</div>';
  }
  document.getElementById('notes-content').innerHTML = html;
}

function renderNotes() {
  renderSubChips();
  renderNoteContent();
}

function startQuiz() {
  var subMap = {sci:'自然',math:'數學',eng:'英文',hist:'歷史',geo:'地理',civ:'公民'};
  var label = subMap[curSubject];
  var pool = [];
  for (var i=0; i<allQ.length; i++) {
    if (allQ[i].s === label) pool.push(allQ[i]);
  }
  if (pool.length === 0) pool = allQ;
  var shuffled = pool.slice().sort(function(){ return Math.random()-0.5; });
  quizQ = shuffled.slice(0, Math.min(15, shuffled.length));
  qIdx = 0; qScore = 0; qAnswered = false;
  renderQ();
}

function renderQ() {
  var q = quizQ[qIdx];
  var pct = Math.round(((qIdx+1)/quizQ.length)*100);
  document.getElementById('q-label').textContent = '題目 '+(qIdx+1)+'/'+quizQ.length;
  document.getElementById('q-score').textContent = '答對：'+qScore;
  document.getElementById('q-bar').style.width = pct+'%';
  qAnswered = false;
  document.getElementById('btn-next').style.display = 'none';
  var diffMap = {易:'tag-g',中:'tag-b',難:'tag-r'};
  var subLabel = q.sub ? q.s+'・'+q.sub : q.s;
  var html = '<div class="q-card"><div class="q-meta"><span class="tag tag-b">'+subLabel+'</span><span class="tag '+(diffMap[q.diff]||'tag-b')+'">'+q.diff+'</span></div>';
  html += '<div class="q-text">'+q.q+'</div><div class="opts" id="opts">';
  for (var i=0; i<q.opts.length; i++) {
    html += '<button class="opt" data-i="'+i+'">'+'ABCD'[i]+'. '+q.opts[i]+'</button>';
  }
  html += '</div><div class="explain" id="explain"><strong>解析：</strong>'+q.exp+'</div></div>';
  document.getElementById('q-container').innerHTML = html;
  document.getElementById('opts').addEventListener('click', function(e) {
    var btn = e.target;
    if (btn.tagName !== 'BUTTON') return;
    if (qAnswered) return;
    checkAns(parseInt(btn.getAttribute('data-i')));
  });
}

function checkAns(i) {
  if (qAnswered) return;
  qAnswered = true;
  var q = quizQ[qIdx];
  var key = q.sub ? q.s+'・'+q.sub : q.s;
  if (!stats[key]) stats[key] = {t:0,c:0};
  stats[key].t++;
  var btns = document.querySelectorAll('.opt');
  for (var k=0; k<btns.length; k++) btns[k].disabled = true;
  if (i === q.ans) {
    qScore++;
    stats[key].c++;
    btns[i].classList.add('correct');
  } else {
    btns[i].classList.add('wrong');
    btns[q.ans].classList.add('correct');
  }
  document.getElementById('explain').classList.add('show');
  document.getElementById('q-score').textContent = '答對：'+qScore;
  document.getElementById('btn-next').style.display = 'inline-block';
}

function nextQ() {
  if (qIdx >= quizQ.length - 1) {
    var pct = Math.round(qScore/quizQ.length*100);
    document.getElementById('q-container').innerHTML = '<div class="q-card" style="text-align:center;padding:28px"><div style="font-size:30px;font-weight:700;color:#378ADD;margin-bottom:8px">'+qScore+'/'+quizQ.length+'</div><div style="font-size:14px;color:#6b6b6b;margin-bottom:18px">正確率 '+pct+'%</div><button class="btn primary" id="btn-restart">再刷一輪</button></div>';
    document.getElementById('btn-next').style.display = 'none';
    document.getElementById('btn-restart').addEventListener('click', startQuiz);
    return;
  }
  qIdx++;
  renderQ();
}

function updateStats() {
  var total=0, correct=0;
  for (var k in stats) { total+=stats[k].t; correct+=stats[k].c; }
  document.getElementById('st-total').textContent = total;
  document.getElementById('st-correct').textContent = correct;
  document.getElementById('st-pct').textContent = total>0?Math.round(correct/total*100)+'%':'—';
  if (total===0) { document.getElementById('weak-list').innerHTML='<p class="hint">先完成練習題，這裡會顯示弱點分析</p>'; return; }
  var html='';
  for (var cat in stats) {
    var v=stats[cat];
    var p=v.t>0?Math.round(v.c/v.t*100):null;
    var color=p===null?'#aaa':p>=70?'var(--green)':p>=50?'var(--amber)':'var(--red)';
    var label=p===null?'未答':p>=70?'良好':p>=50?'需加強':'重點補強';
    html+='<div class="weak-item"><span>'+cat+'</span><span style="display:flex;align-items:center;gap:4px"><span class="mini-bar-bg"><span class="mini-bar" style="width:'+(p||0)+'%;background:'+color+'"></span></span><span style="font-size:12px;color:'+color+';min-width:36px">'+(p!==null?p+'%':'-')+'</span><span style="font-size:12px;color:'+color+'">'+label+'</span></span></div>';
  }
  document.getElementById('weak-list').innerHTML = html;
}

document.getElementById('subject-bar').addEventListener('click', function(e) {
  var btn = e.target;
  if (!btn.classList.contains('sb')) return;
  document.querySelectorAll('.sb').forEach(function(b){ b.classList.remove('on'); });
  btn.classList.add('on');
  curSubject = btn.getAttribute('data-s');
  curSciSub = '生物';
  if (curTab==='notes') renderNotes();
  else if (curTab==='quiz') startQuiz();
});

document.getElementById('tab-bar').addEventListener('click', function(e) {
  var btn = e.target;
  if (!btn.classList.contains('tb')) return;
  document.querySelectorAll('.tb').forEach(function(b){ b.classList.remove('on'); });
  btn.classList.add('on');
  curTab = btn.getAttribute('data-t');
  document.querySelectorAll('.pane').forEach(function(p){ p.classList.remove('on'); });
  document.getElementById('pane-'+curTab).classList.add('on');
  if (curTab==='quiz') startQuiz();
  else if (curTab==='stats') updateStats();
  else renderNotes();
});

document.getElementById('btn-next').addEventListener('click', nextQ);
document.getElementById('btn-reset').addEventListener('click', function() { stats={}; updateStats(); });

renderNotes();
startQuiz();
</script>
</body>
</html>
